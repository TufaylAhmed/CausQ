"$schema" = "./node_modules/wrangler/config-schema.json"
name = "causq-forms"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Non-secret config. Fill ML_GROUP_* after you create the groups in MailerLite.
[vars]
ML_GROUP_BRIEF = "189100009366488366"   # MailerLite group "The Brief"
ML_GROUP_LEADS = "189100011485660699"   # MailerLite group "Leads — Briefing Requests"
FROM_EMAIL    = "hello@causq.com"
FROM_NAME     = "CausQ"
NOTIFY_EMAIL  = "hello@causq.com"

# Serve the Worker on your own domain so the site calls /api/* same-origin.
# Requires causq.com to be an active zone in this Cloudflare account (it is).
[[routes]]
pattern   = "causq.com/api/*"
zone_name = "causq.com"

# Secrets are NOT stored here. Set them once with:
#   wrangler secret put MAILERLITE_API_KEY     (required)
#   wrangler secret put MAILERSEND_API_KEY     (optional: internal lead alerts)
#   wrangler secret put TURNSTILE_SECRET       (optional: bot protection; pair with
#                                               TURNSTILE_SITEKEY in assets/js/main.js)
